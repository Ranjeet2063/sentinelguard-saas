name: SentinelGuard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: TypeCheck, Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck & Build
        run: pnpm build

      - name: Run Invariant Unit & Integration Tests
        run: pnpm test

      - name: Run Security Audit
        run: pnpm audit --audit-level=high
