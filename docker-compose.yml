services:
  sentinelguard-saas:
    build: .
    container_name: sentinelguard-saas-engine
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-development-secret-key-12345}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
