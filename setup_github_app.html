<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SentinelGuard GitHub App 1-Click Setup</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 32px; max-width: 600px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { color: #58a6ff; font-size: 24px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: #8b949e; margin-bottom: 24px; }
    button { background: #238636; color: #ffffff; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2ea043; }
    .footer { margin-top: 20px; font-size: 12px; color: #484f58; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛡️ SentinelGuard GitHub App Setup</h1>
    <p>Clicking the button below will pre-fill all necessary permissions (PR checks, code reviews, and webhook security) automatically on GitHub.</p>
    <form action="https://github.com/settings/apps/new" method="post">
      <input type="hidden" name="manifest" id="manifest">
      <button type="submit">🚀 Register SentinelGuard on GitHub (1-Click)</button>
    </form>
    <div class="footer">Configured for Ranjeet2063 • 100% Secure & Automated</div>
  </div>

  <script>
    const manifest = {
      "name": "SentinelGuard-Auditor-2063",
      "url": "https://github.com/Ranjeet2063/sentinelguard-saas",
      "redirect_url": "https://github.com/Ranjeet2063/sentinelguard-saas",
      "hook_attributes": {
        "url": "https://github.com/Ranjeet2063/sentinelguard-saas",
        "active": false
      },
      "public": true,
      "default_permissions": {
        "pull_requests": "write",
        "issues": "write",
        "checks": "write",
        "contents": "read",
        "metadata": "read"
      },
      "default_events": [
        "pull_request",
        "pull_request_review",
        "check_run",
        "check_suite",
        "issues"
      ],
      "description": "Autonomous security invariant scanner and automated code review auditor for Soroban smart contracts, Web3 protocols, and critical codebases."
    };
    document.getElementById("manifest").value = JSON.stringify(manifest);
  </script>
</body>
</html>
